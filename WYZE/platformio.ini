[env:esp32-c3-devkitm-1]
platform = espressif32
board = lolin_c3_mini
framework = arduino
build_flags = -DCONFIG_SCAN_MAX_AP=10
              -DCONFIG_MGMT_AP_MAX_CONNECTIONS=10
              -Wl,-z,muldefs  


[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
board_build.partitions = min_spiffs.csv
build_flags = -DCONFIG_SCAN_MAX_AP=10
              -DCONFIG_MGMT_AP_MAX_CONNECTIONS=10
              -Wl,-z,muldefs  
; Lightjack laboratory target added 2026-10-21. App-only via preserved loader.
; Arduino 2.x is pinned for upstream API compatibility, not a production release.
[env:lightjack_wyze_poc]
platform = platformio/espressif32@6.12.0
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
                    platformio/tool-esptoolpy@2.40900.250804
                    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions-lightjack.csv
extra_scripts = pre:tools/lightjack_build.py
build_flags = -DLIGHTJACK_WYZE_POC
              -Wl,--wrap=initArduino
              -DCJSON_NESTING_LIMIT=8
              -DCONFIG_SCAN_MAX_AP=10
              -DCONFIG_MGMT_AP_MAX_CONNECTIONS=10
              -Wl,-z,muldefs

; Optional source-only remote TCP POC. Default credentials are absent.
[env:lightjack_wyze_ssh_poc]
extends = env:lightjack_wyze_poc
lib_extra_dirs = third_party/lightjack-ssh
lib_ldf_mode = chain+
build_unflags = -std=gnu++11
build_flags = ${env:lightjack_wyze_poc.build_flags}
              -std=gnu++17
              -DLIGHTJACK_REMOTE_SSH_POC
              -DHAVE_CONFIG_H
              -DLIBSSH2_MBEDTLS
              -DLIBSSH2_NO_ZLIB
              -DMEMFIX_LEVEL=1
